apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice
  template:
    metadata:
      labels:
        app: microservice
    spec:
     containers:
      - name: microservice
        image: selvakumardocker/microservice:v2
        imagePullPolicy: Always
        ports:
          - containerPort: 3000