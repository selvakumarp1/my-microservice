name: Deploy to AKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ✅ Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Step 2: Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ✅ Step 3: Build & Push Backend + Frontend Images
    - name: Build and push Docker images
      run: |
        echo "Building backend image..."
        docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:v${{ github.run_number }} ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/backend:v${{ github.run_number }}

        echo "Building frontend image..."
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:v${{ github.run_number }} ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:v${{ github.run_number }}

    # ✅ Step 4: Set KUBECONFIG
    - name: Set KUBECONFIG
      run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig

    # ✅ Step 5: Deploy to AKS (FIXED IMAGE REPLACEMENT ✅)
    - name: Deploy to AKS
      run: |
        export KUBECONFIG=kubeconfig

        echo "Updating backend image..."
        sed -i "s|selvakumardocker/backend:.*|${{ secrets.DOCKER_USERNAME }}/backend:v${{ github.run_number }}|g" k8s/backend-deployment.yaml

        echo "Updating frontend image..."
        sed -i "s|selvakumardocker/frontend:.*|${{ secrets.DOCKER_USERNAME }}/frontend:v${{ github.run_number }}|g" k8s/frontend-deployment.yaml

        echo "Applying Kubernetes manifests..."
        kubectl apply -f k8s/

    # ✅ Step 6: Restart deployments (FORCE IMAGE PULL ✅)
    - name: Restart deployments
      run: |
        export KUBECONFIG=kubeconfig
        kubectl rollout restart deployment/backend-deployment
        kubectl rollout restart deployment/frontend-deployment

    # ✅ Step 7: Verify rollout (PRO LEVEL ✅)
    - name: Verify deployment rollout
      run: |
        export KUBECONFIG=kubeconfig

        echo "Checking backend rollout..."
        kubectl rollout status deployment/backend-deployment

        echo "Checking frontend rollout..."
        kubectl rollout status deployment/frontend-deployment