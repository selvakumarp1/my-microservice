name: Deploy to AKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/microservice:v${{ github.run_number }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/microservice:v${{ github.run_number }}

    - name: Set KUBECONFIG
      run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig

    - name: Deploy to AKS
      run: |
        export KUBECONFIG=kubeconfig
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/microservice:v${{ github.run_number }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/