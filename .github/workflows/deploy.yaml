name: CI-CD Pipeline (Helm)

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ✅ 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ 2. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ✅ 3. Build & Push Backend Image
    - name: Build and push backend image
      run: |
        docker build -t $DOCKER_USERNAME/backend:v${{ github.run_number }} ./backend
        docker push $DOCKER_USERNAME/backend:v${{ github.run_number }}

    # ✅ 4. Build & Push Frontend Image
    - name: Build and push frontend image
      run: |
        docker build -t $DOCKER_USERNAME/frontend:v${{ github.run_number }} ./frontend
        docker push $DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ 5. Setup kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    # ✅ 6. Configure kubeconfig
    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig

    # ✅ 7. Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v3

    # ✅ 8. Deploy using Helm (CRITICAL FIX ✅🔥)
    - name: Helm upgrade
      env:
        KUBECONFIG: ${{ github.workspace }}/kubeconfig
      run: |
        helm upgrade myapp ./my-microservice-chart \
          --install \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ 9. Verify deployment (CRITICAL FIX ✅🔥)
    - name: Verify deployment
      env:
        KUBECONFIG: ${{ github.workspace }}/kubeconfig
      run: |
        kubectl rollout status deployment/backend-deployment
        kubectl rollout status deployment/frontend-deployment
