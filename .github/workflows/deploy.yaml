name: CI-CD Pipeline (Helm + AKS)

on:
  push:
    branches:
      - main
      - dev

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ✅ 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ 2. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ✅ 3. Build & Push Backend
    - name: Build and push backend
      run: |
        docker build -t $DOCKER_USERNAME/backend:v${{ github.run_number }} ./backend
        docker push $DOCKER_USERNAME/backend:v${{ github.run_number }}

    # ✅ 4. Build & Push Frontend
    - name: Build and push frontend
      run: |
        docker build -t $DOCKER_USERNAME/frontend:v${{ github.run_number }} ./frontend
        docker push $DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ 5. Azure Login
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # ✅ 6. Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    # ✅ 7. Get AKS credentials
    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group myRG --name myAKSClusterNP --overwrite-existing

    # ✅ 8. Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v3

    # ✅ 9. Deploy to DEV
    - name: Deploy to DEV
      if: github.ref == 'refs/heads/dev'
      run: |
        helm upgrade myapp-dev ./my-microservice-chart \
          --install \
          --namespace dev \
          --create-namespace \
          -f my-microservice-chart/values-dev.yaml \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ 10. Deploy to PROD
    - name: Deploy to PROD
      if: github.ref == 'refs/heads/main'
      run: |
        helm upgrade myapp-prod ./my-microservice-chart \
          --install \
          --namespace prod \
          --create-namespace \
          -f my-microservice-chart/values-prod.yaml \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ Verify DEV deployment
    - name: Verify DEV deployment
      if: github.ref == 'refs/heads/dev'
      run: |
        kubectl rollout status deployment/backend-deployment -n dev --timeout=120s
        kubectl rollout status deployment/frontend-deployment -n dev --timeout=120s
    
    # ✅ Verify PROD deployment
    - name: Verify PROD deployment
      if: github.ref == 'refs/heads/main'
      run: |
        kubectl rollout status deployment/backend-deployment -n prod --timeout=120s
        kubectl rollout status deployment/frontend-deployment -n prod --timeout=120s
