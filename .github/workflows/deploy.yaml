name: CI-CD Pipeline (Helm + AKS)

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ✅ 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ 2. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ✅ 3. Build & Push Backend
    - name: Build and push backend
      run: |
        docker build -t $DOCKER_USERNAME/backend:v${{ github.run_number }} ./backend
        docker push $DOCKER_USERNAME/backend:v${{ github.run_number }}

    # ✅ 4. Build & Push Frontend
    - name: Build and push frontend
      run: |
        docker build -t $DOCKER_USERNAME/frontend:v${{ github.run_number }} ./frontend
        docker push $DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ 5. Azure Login (CRITICAL)
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # ✅ 6. Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    # ✅ 7. Get AKS credentials (CRITICAL FIX ✅🔥)
    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group myRG --name myAKSClusterNP --overwrite-existing

    # ✅ 8. Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v3

    # ✅ 9. Deploy using Helm
    - name: Helm upgrade
      run: |
        helm upgrade myapp ./my-microservice-chart \
          --install \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ 10. FORCE CLEANUP (FIX rollout deadlock ✅🔥)
    - name: Cleanup old pods
      run: |
        kubectl delete pod -l app=backend --ignore-not-found=true
        kubectl delete pod -l app=frontend --ignore-not-found=true

    # ✅ 11. Verify deployment (WITH TIMEOUT FIX ✅)
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/backend-deployment --timeout=120s
        kubectl rollout status deployment/frontend-deployment --timeout=120s
