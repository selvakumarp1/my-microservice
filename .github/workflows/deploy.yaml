name: CI-CD Pipeline (Helm + AKS)

on:
  push:
    branches:
      - main
      - dev

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend
      run: |
        docker build -t $DOCKER_USERNAME/backend:v${{ github.run_number }} ./backend
        docker push $DOCKER_USERNAME/backend:v${{ github.run_number }}

    - name: Build and push frontend
      run: |
        docker build -t $DOCKER_USERNAME/frontend:v${{ github.run_number }} ./frontend
        docker push $DOCKER_USERNAME/frontend:v${{ github.run_number }}

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group myRG --name myAKSClusterNP --overwrite-existing

    - name: Install Helm
      uses: azure/setup-helm@v3

    #  Deploy to DEV
    - name: Deploy to DEV
      if: github.ref == 'refs/heads/dev'
      run: |
        helm upgrade myapp-dev ./my-microservice-chart \
          --install \
          -f my-microservice-chart/values-dev.yaml \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # Deploy to PROD
    - name: Deploy to PROD
      if: github.ref == 'refs/heads/main'
      run: |
        helm upgrade myapp-prod ./my-microservice-chart \
          --install \
          -f my-microservice-chart/values-prod.yaml \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ IMPORTANT: NO FORCE DELETE NOW (Recreate strategy handles it)

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/backend-deployment --timeout=120s
        kubectl rollout status deployment/frontend-deployment --timeout=120s
