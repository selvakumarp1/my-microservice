name: CI-CD Pipeline (Helm)

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ✅ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Docker login
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ✅ Build & Push Backend
    - name: Build and push backend image
      run: |
        docker build -t $DOCKER_USERNAME/backend:v${{ github.run_number }} ./backend
        docker push $DOCKER_USERNAME/backend:v${{ github.run_number }}

    # ✅ Build & Push Frontend
    - name: Build and push frontend image
      run: |
        docker build -t $DOCKER_USERNAME/frontend:v${{ github.run_number }} ./frontend
        docker push $DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ Setup kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    # ✅ Setup kubeconfig
    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
    - name: Set KUBECONFIG env
      run: echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV   

    # ✅ Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v3

    # ✅ Deploy using Helm (PRO LEVEL ✅🔥)
    - name: Helm upgrade
      run: |
        export KUBECONFIG=$PWD/kubeconfig

        helm upgrade myapp ./my-microservice-chart \
          --install \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ Verify rollout
    - name: Verify deployment
      run: |
        export KUBECONFIG=$PWD/kubeconfig

        kubectl rollout status deployment/backend-deployment
        kubectl rollout status deployment/frontend-deployment
