name: CI-CD Pipeline (Helm + AKS)

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ✅ Checkout
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Docker login
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ✅ Build & push backend
    - name: Build and push backend
      run: |
        docker build -t $DOCKER_USERNAME/backend:v${{ github.run_number }} ./backend
        docker push $DOCKER_USERNAME/backend:v${{ github.run_number }}

    # ✅ Build & push frontend
    - name: Build and push frontend
      run: |
        docker build -t $DOCKER_USERNAME/frontend:v${{ github.run_number }} ./frontend
        docker push $DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ Azure login
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # ✅ Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    # ✅ Get AKS credentials (CRITICAL FIX ✅🔥)
    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group myRG --name myAKSClusterNP --overwrite-existing

    # ✅ Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v3

    # ✅ Deploy with Helm
    - name: Helm upgrade
      run: |
        helm upgrade myapp ./my-microservice-chart \
          --install \
          --set backend.image=$DOCKER_USERNAME/backend:v${{ github.run_number }} \
          --set frontend.image=$DOCKER_USERNAME/frontend:v${{ github.run_number }}

    # ✅ Verify deployment
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/backend-deployment
        kubectl rollout status deployment/frontend-deployment
