<!DOCTYPE html>
<html>
<head>
  <title>Microservice App</title>
</head>
<body>
  <h1>Frontend UI</h1>
  <button onclick="callAPI()">Call Backend</button>
  <p id="response"></p>

  <script>
    async function callAPI() {
      try {
        const res = await fetch('http://backend-service.default.svc.cluster.local');
        const data = await res.text();
        document.getElementById('response').innerText = data;
      } catch (error) {
        console.error("Error:", error);
        document.getElementById('response').innerText = "❌ Failed to call backend";
      }
    }
  </script>
</body>
</html>
