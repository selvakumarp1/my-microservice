<!DOCTYPE html>
<html>
<head>
  <title>Microservice App</title>
</head>
<body>
  <h1>Frontend UI</h1>
  <button onclick="callAPI()">Call Backend Now</button>
  <p id="response"></p>

  <script>
    async function callAPI() {
      const res = await fetch('http://20.205.145.204');
      const data = await res.text();
      document.getElementById('response').innerText = data;
    }
  </script>
</body>
</html>
