apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx

  rules:
  - http:
      paths:
      # ✅ FRONTEND ROUTE
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

      # ✅ BACKEND ROUTE
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80